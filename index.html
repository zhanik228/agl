*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 6px}
p{margin:0 0 14px;color:var(--muted)}
h2{font-size:1rem;margin:22px 0 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip,.btn,.opt{font:inherit;color:inherit;cursor:pointer}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px}

.btn{border:0;background:var(--accent);color:var(--accentink);border-radius:10px;padding:13px 22px;font-weight:600;min-height:48px}

.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin-bottom:8px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-size:1.25rem;line-height:1.35;margin:0 0 18px;font-weight:600}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:52px}
.opt b{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;color:var(--muted)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.msg{margin:16px 0 0;font-weight:600}
.score{font-size:3rem;font-weight:700;line-height:1;margin:10px 0}
.miss{border-top:1px solid var(--line);padding:12px 0}
.miss div{color:var(--muted);font-size:.95rem}
.miss em{font-style:normal;color:var(--ok);font-weight:600}
.hint{font-size:.85rem;color:var(--muted);margin-top:18px}
</style>

var app=document.getElementById('app');
var cfg={n:30,src:0};
var S=null;
var LET=['A','B','C','D','E'];
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function chips(name,vals,cur){return '<div class="chips">'+vals.map(function(v){return '<button class="chip" aria-pressed="'+(String(v[0])===String(cur))+'" data-k="'+name+'" data-v="'+v[0]+'">'+v[1]+'</button>'}).join('')+'</div>'}
function home(){
  var p=pool().length;
  var counts=[[10,'10'],[20,'20'],[30,'30'],[50,'50'],[999,'Все']];

  (DATA.some(function(q){return q.s===2})?'<h2>Откуда брать</h2>'+chips('src',[[0,'Все ('+DATA.length+')'],[1,'СРО 1 ('+DATA.filter(function(q){return q.s===1}).length+')'],[2,'Units 4–6 ('+DATA.filter(function(q){return q.s===2}).length+')']],cfg.src):'')+

  '<div class="bar"><i style="width:'+(S.i/S.list.length*100)+'%"></i></div>'+
